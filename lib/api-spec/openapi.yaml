        merchandiseId: { type: string, minLength: 1 }
        quantity: { type: integer, minimum: 1, maximum: 20, default: 1 }
      required: [cartId, merchandiseId]
    CartLineUpdateInput:
      type: object
      properties:
        cartId: { type: string, minLength: 1 }
        lineId: { type: string, minLength: 1 }
        quantity: { type: integer, minimum: 1, maximum: 20 }
      required: [cartId, lineId, quantity]
    CartLineRemoveInput:
      type: object
      properties:
        cartId: { type: string, minLength: 1 }
        lineId: { type: string, minLength: 1 }
