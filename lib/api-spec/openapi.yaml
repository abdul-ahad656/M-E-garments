        displayFulfillmentStatus: { type: ["string", "null"] }
        totalPrice: { $ref: "#/components/schemas/Money" }
        lineItems:
          type: array
          items: { $ref: "#/components/schemas/OrderLineItem" }
        fulfillments:
          type: array
