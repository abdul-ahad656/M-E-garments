            city: { type: string, minLength: 1, maxLength: 100 }
            region: { type: ["string", "null"], maxLength: 100 }
            postalCode: { type: ["string", "null"], maxLength: 32 }
            country: { type: string, minLength: 2, maxLength: 56 }
            phone: { type: ["string", "null"], maxLength: 40 }
    CheckoutOrder:
      type: object
