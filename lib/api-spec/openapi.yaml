          $ref: "#/components/schemas/Money"
        compareAtPrice:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        image:
          oneOf:
            - $ref: "#/components/schemas/ProductImage"
            - type: "null"
        selectedOptions:
          type: array
          items:
            $ref: "#/components/schemas/SelectedOption"
        product:
          $ref: "#/components/schemas/CartLineProduct"
      required: [id, title, price, compareAtPrice, image, selectedOptions, product]
    CartLine:
      type: object
      properties:
        id: { type: string }
